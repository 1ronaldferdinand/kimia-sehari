name: Daily Kimia Sehari Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate motion graphic & render Remotion video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/generate-video.mjs

      - name: Upload video for public HTTPS URL (works for Private repos)
        id: release
        run: |
          VIDEO_URL=$(node -e '
            const fs = require("fs");
            const blob = new Blob([fs.readFileSync("out/video.mp4")], { type: "video/mp4" });
            (async () => {
              try {
                const d1 = new FormData();
                d1.append("files[]", blob, "video.mp4");
                const r1 = await fetch("https://uguu.se/upload", { method: "POST", body: d1 });
                const j1 = await r1.json();
                if (j1?.files?.[0]?.url) {
                  console.log(j1.files[0].url);
                  return;
                }
              } catch {}
              const d2 = new FormData();
              d2.append("file", blob, "video.mp4");
              const r2 = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: d2 });
              const j2 = await r2.json();
              if (j2?.data?.url) {
                console.log(j2.data.url.replace(/^https?:\/\/tmpfiles\.org\//, "https://tmpfiles.org/dl/"));
                return;
              }
              throw new Error("All uploaders failed");
            })();
          ')
          echo "Uploaded URL: $VIDEO_URL"
          echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"

      - name: Trigger Make.com Webhook (Telegram + IG Reels)
        env:
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          VIDEO_URL: ${{ steps.release.outputs.video_url }}
        run: |
          node -e '
            if (!process.env.MAKE_WEBHOOK_URL) {
              console.log("MAKE_WEBHOOK_URL tidak disetel, lewati webhook.");
              process.exit(0);
            }
            const fs = require("fs");
            const meta = JSON.parse(fs.readFileSync("out/metadata.json", "utf8"));
            fetch(process.env.MAKE_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                brand: "Kimia Sehari",
                date: meta.date,
                palette: ["Cokelat", "Hijau", "Putih"],
                payload: {
                  topik: meta.topik,
                  judul_pendek: meta.judul_pendek,
                  caption: meta.caption,
                  video_url: process.env.VIDEO_URL
                }
              })
            }).then(async r => {
              if (!r.ok) throw new Error("Webhook gagal: " + r.status + " " + await r.text());
              console.log("Webhook terkirim:", r.status);
            });
          '
