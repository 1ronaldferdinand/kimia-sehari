<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Kimia Sehari — Bang Motion Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #F7F4EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #3B281E;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(170deg, #FAF8F3 0%, #F7F4EC 55%, #EFE9DC 100%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(64px); pointer-events: none; }
  #orb1 { width: 640px; height: 640px; left: -160px; top: -120px; background: rgba(46, 111, 64, 0.13); }
  #orb2 { width: 600px; height: 600px; right: -140px; bottom: 260px; background: rgba(217, 119, 6, 0.11); }

  /* Frame 0 Cover Thumbnail */
  #cover {
    position: absolute; inset: 0; z-index: 40;
    background: linear-gradient(165deg, #FAF8F3 0%, #F7F4EC 60%, #EDE6D6 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 96px 76px; text-align: center;
  }
  #cover .c-badge {
    background: #2E6F40; color: #FFFFFF; padding: 14px 36px; border-radius: 999px;
    font-size: 28px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    box-shadow: 0 12px 30px rgba(46, 111, 64, 0.25);
  }
  #cover .c-title {
    margin-top: 38px; font-size: 74px; font-weight: 900; line-height: 1.15; color: #3B281E; max-width: 920px;
  }
  #cover .c-sub {
    margin-top: 28px; font-size: 30px; font-weight: 700; color: #6D4C41;
  }

  /* Header */
  #header {
    position: absolute; top: 96px; left: 56px; right: 56px; z-index: 20;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
  }
  #h-badge {
    background: #2E6F40; color: #FFFFFF; padding: 12px 28px; border-radius: 999px;
    font-size: 23px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  #h-title {
    font-size: 24px; font-weight: 800; color: #6D4C41; text-align: right; max-width: 480px;
    line-height: 1.25;
  }

  /* Main World */
  #world {
    position: absolute; top: 196px; bottom: 320px; left: 56px; right: 56px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  #headline {
    font-size: 52px; font-weight: 900; color: #3B281E; text-align: center;
    line-height: 1.18; max-width: 900px; min-height: 64px;
  }
  #cam {
    width: 880px; height: 640px; border-radius: 40px;
    background: rgba(255, 255, 255, 0.86);
    border: 2px solid rgba(59, 40, 30, 0.08);
    box-shadow: 0 24px 60px rgba(59, 40, 30, 0.08);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #callouts {
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 920px;
  }
  .pill {
    background: #FFFFFF; color: #3B281E; border: 1.5px solid rgba(46, 111, 64, 0.28);
    padding: 15px 28px; border-radius: 999px; font-size: 25px; font-weight: 800;
    box-shadow: 0 8px 24px rgba(59, 40, 30, 0.08);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="orb1" class="orb"></div>
  <div id="orb2" class="orb"></div>

  <div id="header">
    <div id="h-badge">Kimia Sehari</div>
    <div id="h-title">Kimia Sehari</div>
  </div>

  <div id="world">
    <div id="headline">Keajaiban Kimia Sehari-hari</div>
    <div id="cam">
      <svg id="vis" viewBox="0 0 880 640" width="880" height="640"></svg>
    </div>
    <div id="callouts"></div>
  </div>

  <div id="cover">
    <div class="c-badge">Kimia Sehari</div>
    <div class="c-title" id="coverTitle">Keajaiban Kimia di Sekitar Kita</div>
    <div class="c-sub">Fakta Sains Singkat &bull; 60 Detik</div>
  </div>
</div>

<script src="/gsap.min.js"></script>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const data = window.__SCENE_DATA__ || {
    judul_pendek: "Keajaiban Kimia di Sekitar Kita",
    topik: "Keajaiban Kimia di Sekitar Kita",
    totalDuration: 30,
    scenes: [
      { badge: "Fakta Alam", headline: "Fenomena Nyata", visual_type: "hook", start: 0.45, duration: 5, callouts: ["FENOMENA", "REAKSI"] }
    ]
  };

  document.getElementById("coverTitle").textContent = data.judul_pendek || data.topik || "Kimia Sehari";
  document.getElementById("h-title").textContent = data.judul_pendek || "Kimia Sehari";

  const svg = document.getElementById("vis");
  const headlineEl = document.getElementById("headline");
  const badgeEl = document.getElementById("h-badge");
  const calloutsEl = document.getElementById("callouts");

  function el(tag, attrs = {}, parent = svg) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    if (parent) parent.appendChild(node);
    return node;
  }

  function addDefs() {
    const defs = el("defs", {}, svg);
    const grads = [
      ["gGreen", "#4CAF50", "#2E6F40"],
      ["gBlue", "#38BDF8", "#0284C7"],
      ["gAmber", "#FBBF24", "#D97706"],
      ["gBrown", "#8D6E63", "#4E342E"],
      ["gBerry", "#F472B6", "#BE185D"],
    ];
    grads.forEach(([id, c1, c2]) => {
      const g = el("radialGradient", { id, cx: "35%", cy: "30%", r: "70%" }, defs);
      el("stop", { offset: "0%", "stop-color": c1 }, g);
      el("stop", { offset: "100%", "stop-color": c2 }, g);
    });
  }

  function renderSceneVisual(sc) {
    svg.innerHTML = "";
    addDefs();
    const type = sc.visual_type || "hook";

    if (type === "molecule") {
      const atoms = (sc.atoms && sc.atoms.length ? sc.atoms : ["C", "H", "O", "H"]).slice(0, 5);
      const colors = ["url(#gGreen)", "url(#gBlue)", "url(#gAmber)", "url(#gBerry)", "url(#gBrown)"];
      const cx = 440, cy = 320, rOrbit = 175;

      el("circle", { id: "mRing", cx, cy, r: rOrbit + 48, fill: "none", stroke: "rgba(46,111,64,0.18)", "stroke-width": 4, "stroke-dasharray": "12 10" });

      const satCoords = atoms.slice(1).map((_, i) => {
        const ang = ((i * 2 * Math.PI) / Math.max(1, atoms.length - 1)) - Math.PI / 2;
        return { x: cx + Math.cos(ang) * rOrbit, y: cy + Math.sin(ang) * rOrbit };
      });

      satCoords.forEach((pt, i) => {
        el("line", {
          class: "v-bond", x1: cx, y1: cy, x2: pt.x, y2: pt.y,
          stroke: "#6D4C41", "stroke-width": 12, "stroke-linecap": "round",
          "stroke-dasharray": 220, "stroke-dashoffset": 220, opacity: 0.75
        });
      });

      // Center atom
      const gCenter = el("g", { class: "v-node" });
      el("circle", { cx, cy, r: 68, fill: colors[0] }, gCenter);
      const t0 = el("text", { x: cx, y: cy + 12, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 36, "font-weight": 900 }, gCenter);
      t0.textContent = String(atoms[0]).slice(0, 5);

      satCoords.forEach((pt, i) => {
        const gSat = el("g", { class: "v-node" });
        el("circle", { cx: pt.x, cy: pt.y, r: 48, fill: colors[(i + 1) % colors.length] }, gSat);
        const ts = el("text", { x: pt.x, y: pt.y + 10, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 28, "font-weight": 800 }, gSat);
        ts.textContent = String(atoms[i + 1]).slice(0, 5);
      });
      return;
    }

    if (type === "reaction") {
      const reactants = (sc.reactants && sc.reactants.length ? sc.reactants : ["Zat A", "Zat B"]).slice(0, 2);
      const catalyst = sc.catalyst || "Reaksi";
      const product = sc.product || "Hasil Baru";

      // Top row: Reactant 1 + Reactant 2
      const cards = [
        { x: 110, y: 80, w: 280, h: 165, fill: "#FAF8F3", stroke: "#6D4C41", text: reactants[0], tc: "#3B281E" },
        { x: 490, y: 80, w: 280, h: 165, fill: "#FAF8F3", stroke: "#0284C7", text: reactants[1] || "Energi", tc: "#3B281E" },
      ];
      cards.forEach((c) => {
        const g = el("g", { class: "v-node" });
        el("rect", { x: c.x, y: c.y, width: c.w, height: c.h, rx: 28, fill: c.fill, stroke: c.stroke, "stroke-width": 4 }, g);
        const t = el("text", { x: c.x + c.w / 2, y: c.y + 92, "text-anchor": "middle", fill: c.tc, "font-size": 28, "font-weight": 800 }, g);
        t.textContent = String(c.text).slice(0, 18);
      });

      // Plus badge
      const gPlus = el("g", { class: "v-node" });
      el("circle", { cx: 440, cy: 162, r: 30, fill: "#D97706" }, gPlus);
      const tp = el("text", { x: 440, y: 173, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 36, "font-weight": 900 }, gPlus);
      tp.textContent = "+";

      // Arrow + Catalyst
      el("line", { class: "v-bond", x1: 440, y1: 265, x2: 440, y2: 375, stroke: "#2E6F40", "stroke-width": 10, "stroke-linecap": "round", "stroke-dasharray": 130, "stroke-dashoffset": 130 });
      el("polygon", { class: "v-node", points: "440,398 422,366 458,366", fill: "#2E6F40" });
      const tCat = el("text", { class: "v-node", x: 466, y: 332, fill: "#6D4C41", "font-size": 22, "font-weight": 700 }, svg);
      tCat.textContent = String(catalyst).slice(0, 20);

      // Product card
      const gProd = el("g", { class: "v-node" });
      el("rect", { x: 180, y: 415, width: 520, height: 155, rx: 32, fill: "#2E6F40" }, gProd);
      const tOut = el("text", { x: 440, y: 503, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 34, "font-weight": 900 }, gProd);
      tOut.textContent = String(product).slice(0, 24);
      return;
    }

    if (type === "zoom") {
      const cx = 440, cy = 320;
      [250, 185, 120].forEach((r, idx) => {
        el("circle", {
          class: "v-node", cx, cy, r,
          fill: idx === 2 ? "url(#gBlue)" : "none",
          stroke: idx === 0 ? "#2E6F40" : "#0284C7",
          "stroke-width": idx === 2 ? 0 : 6,
          "stroke-dasharray": idx === 1 ? "14 10" : "none",
          opacity: idx === 2 ? 0.92 : 0.35 + idx * 0.25
        });
      });
      const t = el("text", { class: "v-node", x: cx, y: cy + 12, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 32, "font-weight": 900 });
      t.textContent = String((sc.callouts && sc.callouts[0]) || "MIKRO").slice(0, 14);
      return;
    }

    if (type === "summary") {
      const pts = (sc.callouts && sc.callouts.length ? sc.callouts : ["Proses Alami", "Reaksi Stabil", "Manfaat Nyata"]).slice(0, 3);
      pts.forEach((p, idx) => {
        const y = 78 + idx * 170;
        const g = el("g", { class: "v-node" });
        el("rect", { x: 80, y, width: 720, height: 132, rx: 28, fill: idx === pts.length - 1 ? "#2E6F40" : "#FAF8F3", stroke: "#2E6F40", "stroke-width": 3 }, g);
        el("circle", { cx: 155, cy: y + 66, r: 34, fill: idx === pts.length - 1 ? "#FFFFFF" : "#2E6F40" }, g);
        const tn = el("text", { x: 155, y: y + 77, "text-anchor": "middle", fill: idx === pts.length - 1 ? "#2E6F40" : "#FFFFFF", "font-size": 30, "font-weight": 900 }, g);
        tn.textContent = String(idx + 1);
        const tt = el("text", { x: 220, y: y + 76, fill: idx === pts.length - 1 ? "#FFFFFF" : "#3B281E", "font-size": 28, "font-weight": 800 }, g);
        tt.textContent = String(p).slice(0, 28);
      });
      return;
    }

    // Default: "hook"
    const cx = 440, cy = 320;
    el("circle", { id: "mRing", cx, cy, r: 215, fill: "none", stroke: "rgba(46,111,64,0.22)", "stroke-width": 5, "stroke-dasharray": "16 12" });
    el("circle", { class: "v-node", cx, cy, r: 120, fill: "url(#gGreen)" });
    el("circle", { class: "v-node", cx: cx + 190, cy: cy - 125, r: 44, fill: "url(#gAmber)" });
    el("circle", { class: "v-node", cx: cx - 185, cy: cy + 125, r: 38, fill: "url(#gBlue)" });
    const th = el("text", { class: "v-node", x: cx, y: cy + 14, "text-anchor": "middle", fill: "#FFFFFF", "font-size": 44, "font-weight": 900 });
    th.textContent = "?";
  }

  const tl = gsap.timeline({ paused: true });
  const dur = Number(data.totalDuration) || 30;

  // Frame 0 Cover Thumbnail -> smooth transition into Scene 1
  tl.to("#cover", { opacity: 0, scale: 1.05, duration: 0.45, ease: "power3.inOut" }, 0.35);
  tl.set("#cover", { display: "none" }, 0.8);

  // Continuous background drift
  tl.to("#orb1", { x: 120, y: 90, duration: dur, ease: "sine.inOut" }, 0);
  tl.to("#orb2", { x: -110, y: -90, duration: dur, ease: "sine.inOut" }, 0);

  (data.scenes || []).forEach((sc, idx) => {
    const t0 = Number(sc.start) || 0.45;
    const sd = Math.max(1.5, Number(sc.duration) || 4);
    const camScale = sc.visual_type === "zoom" ? 1.12 : sc.visual_type === "summary" ? 1.0 : 1.04;

    tl.call(() => {
      badgeEl.textContent = `${idx + 1}/${data.scenes.length} • ${sc.badge || "Kimia Sehari"}`;
      headlineEl.textContent = sc.headline || data.judul_pendek || "Kimia Sehari";
      renderSceneVisual(sc);

      calloutsEl.innerHTML = "";
      (sc.callouts || []).slice(0, 3).forEach((txt) => {
        const d = document.createElement("div");
        d.className = "pill";
        d.textContent = txt;
        calloutsEl.appendChild(d);
      });

      gsap.fromTo("#headline", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" });
      gsap.fromTo("#vis .v-node", { scale: 0.82, opacity: 0, transformOrigin: "center" }, { scale: 1, opacity: 1, duration: 0.55, stagger: 0.1, ease: "back.out(1.4)" });
      gsap.to("#vis .v-bond", { strokeDashoffset: 0, duration: 0.7, stagger: 0.12, ease: "power2.out" });
      gsap.fromTo("#callouts .pill", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.1, delay: 0.25, ease: "power2.out" });
    }, null, t0);

    tl.to("#cam", { scale: camScale, duration: sd * 0.85, ease: "power2.inOut" }, t0);
  });

  tl.to({}, { duration: 0.01 }, dur);

  window.OPENER = { tl, DURATION: dur, ready: true };
  if (!location.search.includes("clean=1")) {
    tl.repeat(-1).play(0);
  }
})();
</script>
</body>
</html>
