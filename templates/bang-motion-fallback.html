<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Kimia Sehari — Tablet Sketch Explainer (iPad Sketch)</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #F3EADB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #43362E;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #F3EADB;
  }
  /* Subtle screen-space corner vignette */
  #vig {
    position: absolute; inset: 0; pointer-events: none; z-index: 30;
    background: radial-gradient(85% 85% at 50% 50%, transparent 62%, rgba(67, 54, 46, 0.10) 100%);
  }

  /* One continuous tablet canvas */
  #pageCam {
    position: absolute; left: 0; top: 0; width: 2600px; height: 3600px;
    transform-origin: 0 0; will-change: transform;
  }
  #paperBg {
    position: absolute; inset: 0; background: #F3EADB;
  }
  #pageSvg {
    position: absolute; inset: 0; width: 2600px; height: 3600px; overflow: visible;
  }

  /* Screen-space Header HUD */
  #header {
    position: absolute; top: 88px; left: 56px; right: 56px; z-index: 25;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    pointer-events: none;
  }
  #h-badge {
    background: #43362E; color: #F3EADB; padding: 11px 26px; border-radius: 999px;
    font-size: 22px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  #h-title {
    font-family: 'Caveat', cursive; font-size: 36px; font-weight: 700; color: #43362E;
    text-align: right; max-width: 480px; line-height: 1.1;
  }

  /* Handwritten callout notes pinned cleanly below visual zone */
  #callouts {
    position: absolute; bottom: 295px; left: 56px; right: 56px; z-index: 25;
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; pointer-events: none;
  }
  .note-pill {
    background: rgba(243, 234, 219, 0.94); color: #43362E;
    border: 2.5px solid #43362E; border-radius: 16px;
    padding: 10px 24px; font-family: 'Caveat', cursive; font-size: 34px; font-weight: 700;
    box-shadow: 5px 5px 0 rgba(241, 192, 79, 0.75);
  }

  /* Stylus (no hand) */
  #stylus {
    position: absolute; left: 0; top: 0; z-index: 28; pointer-events: none;
    width: 180px; height: 28px; transform-origin: 0 14px;
    opacity: 0;
  }

  /* Frame 0 Cover Thumbnail */
  #cover {
    position: absolute; inset: 0; z-index: 40;
    background: #F3EADB;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 96px 76px; text-align: center;
  }
  #cover .c-badge {
    border: 3px solid #43362E; color: #43362E; padding: 12px 34px; border-radius: 999px;
    font-size: 26px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    background: #F1C04F; box-shadow: 6px 6px 0 rgba(67, 54, 46, 0.18);
  }
  #cover .c-title {
    margin-top: 40px; font-family: 'Caveat', cursive; font-size: 92px; font-weight: 700;
    line-height: 1.08; color: #43362E; max-width: 920px; position: relative;
  }
  #cover .c-line {
    margin-top: 22px; width: 340px; height: 8px; border-radius: 999px; background: #DC6A4C;
  }
  #cover .c-sub {
    margin-top: 28px; font-size: 26px; font-weight: 700; color: #7C6B5D; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="pageCam">
    <div id="paperBg"></div>
    <svg id="pageSvg" viewBox="0 0 2600 3600" width="2600" height="3600">
      <defs>
        <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.21  0 0 0 0 0.18  0 0 0 0.055 0"/>
        </filter>
        <filter id="pencilTooth" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="chalkEdge" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <rect width="2600" height="3600" fill="#F3EADB"/>
      <rect width="2600" height="3600" filter="url(#paperGrain)"/>
      <g id="constructionLayer" opacity="0.48"></g>
      <g id="worldLayer"></g>
    </svg>
  </div>

  <!-- Clean Apple-Pencil-style Stylus (no hand) -->
  <svg id="stylus" viewBox="0 0 180 28" width="180" height="28">
    <polygon points="0,14 22,7 22,21" fill="#F3EADB" stroke="#43362E" stroke-width="2"/>
    <polygon points="0,14 8,11.5 8,16.5" fill="#43362E"/>
    <rect x="22" y="7" width="142" height="14" rx="4" fill="#FFFFFF" stroke="#43362E" stroke-width="2.2"/>
    <rect x="140" y="7" width="12" height="14" fill="#DC6A4C"/>
  </svg>

  <div id="header">
    <div id="h-badge">Kimia Sehari</div>
    <div id="h-title">Kimia Sehari</div>
  </div>
  <div id="callouts"></div>
  <div id="vig"></div>

  <!-- Cover Thumbnail (Frame 0) -->
  <div id="cover">
    <div class="c-badge">Kimia Sehari &bull; Sketch</div>
    <div class="c-title" id="coverTitle">Keajaiban Kimia di Sekitar Kita</div>
    <div class="c-line"></div>
    <div class="c-sub">Tablet Sketch Explainer</div>
  </div>
</div>

<script src="/gsap.min.js"></script>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const GRAPHITE = "#43362E";
  const LIGHT_GRAPH = "#A8998A";
  const CORAL = "#DC6A4C";
  const MUSTARD = "#F1C04F";
  const SUBJECT_COLORS = ["#7FB069", "#6BB5D9", "#F1C04F", "#DC6A4C", "#B37BA4"];

  const data = window.__SCENE_DATA__ || {
    judul_pendek: "Keajaiban Kimia di Sekitar Kita",
    topik: "Keajaiban Kimia di Sekitar Kita",
    totalDuration: 30,
    scenes: [
      { badge: "Fakta Alam", headline: "Fenomena Nyata", visual_type: "hook", start: 0.45, duration: 5, callouts: ["FENOMENA", "REAKSI"] }
    ]
  };

  document.getElementById("coverTitle").textContent = data.judul_pendek || data.topik || "Kimia Sehari";
  document.getElementById("h-title").textContent = data.judul_pendek || "Kimia Sehari";

  const world = document.getElementById("worldLayer");
  const construct = document.getElementById("constructionLayer");
  const badgeEl = document.getElementById("h-badge");
  const calloutsEl = document.getElementById("callouts");

  function el(tag, attrs = {}, parent = world) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    if (parent) parent.appendChild(node);
    return node;
  }

  function addHandText(txt, x, y, size = 34, color = GRAPHITE, anchor = "middle", parent = world) {
    const t = el("text", {
      x, y, fill: color, "text-anchor": anchor,
      "font-family": "'Caveat', cursive", "font-size": size, "font-weight": 700,
    }, parent);
    t.textContent = txt;
    return t;
  }

  // Off-register colour block + graphite line helper (Line first, colour second)
  function addSketchCircle(cx, cy, r, fill, g, label = "") {
    // 1. Light construction guide
    el("circle", { cx, cy, r: r + 10, fill: "none", stroke: LIGHT_GRAPH, "stroke-width": 1.8, "stroke-dasharray": "8 8" }, construct);
    // 2. Off-register chalk colour block (+8, +8) underneath graphite
    const blk = el("circle", {
      class: "sk-block", cx: cx + 8, cy: cy + 8, r,
      fill, opacity: 0, filter: "url(#chalkEdge)", style: "mix-blend-mode:multiply"
    }, g);
    // 3. Graphite outline drawn first
    const circLen = Math.ceil(2 * Math.PI * r);
    const line = el("circle", {
      class: "sk-line", cx, cy, r, fill: "none",
      stroke: GRAPHITE, "stroke-width": 4.5, "stroke-linecap": "round",
      "stroke-dasharray": circLen, "stroke-dashoffset": circLen, filter: "url(#pencilTooth)"
    }, g);
    if (label) {
      addHandText(label, cx, cy + 11, Math.min(40, r * 0.65), GRAPHITE, "middle", g).classList.add("sk-text");
    }
    return { blk, line };
  }

  function addSketchRect(x, y, w, h, rx, fill, g, label = "", accentColor = GRAPHITE) {
    el("rect", { x: x - 8, y: y - 8, width: w + 16, height: h + 16, rx: rx + 4, fill: "none", stroke: LIGHT_GRAPH, "stroke-width": 1.6, "stroke-dasharray": "8 8" }, construct);
    const blk = el("rect", {
      class: "sk-block", x: x + 8, y: y + 8, width: w, height: h, rx,
      fill, opacity: 0, filter: "url(#chalkEdge)", style: "mix-blend-mode:multiply"
    }, g);
    const perim = Math.ceil(2 * (w + h));
    const line = el("rect", {
      class: "sk-line", x, y, width: w, height: h, rx, fill: "none",
      stroke: accentColor, "stroke-width": 4.2, "stroke-linecap": "round",
      "stroke-dasharray": perim, "stroke-dashoffset": perim, filter: "url(#pencilTooth)"
    }, g);
    if (label) {
      addHandText(label, x + w / 2, y + h / 2 + 11, 36, GRAPHITE, "middle", g).classList.add("sk-text");
    }
    return { blk, line };
  }

  // Meandering 2-column positions on the 2600x3600 page (supports up to 8 scenes)
  const SLOTS = [
    { x: 640, y: 760, rot: -1.2, zoom: 1.04 },
    { x: 1860, y: 800, rot: 1.6, zoom: 1.06 },
    { x: 700, y: 1520, rot: -1.5, zoom: 1.05 },
    { x: 1860, y: 1580, rot: 1.8, zoom: 1.12 },
    { x: 680, y: 2340, rot: -1.8, zoom: 1.06 },
    { x: 1860, y: 2400, rot: 1.4, zoom: 1.04 },
    { x: 720, y: 3100, rot: -1.0, zoom: 1.05 },
    { x: 1840, y: 3120, rot: 0, zoom: 1.08 },
  ];

  function drawCharacter(g, x, y, role, isActive, mood, facing = 1) {
    const cg = el("g", { transform: `translate(${x}, ${y})` }, g);
    if (isActive) {
      el("circle", { class: "sk-block", cx: 0, cy: -10, r: 108, fill: MUSTARD, opacity: 0, filter: "url(#chalkEdge)" }, cg);
    }
    const shirtColor = role === "kimi" ? SUBJECT_COLORS[3] : role === "budi" ? SUBJECT_COLORS[1] : SUBJECT_COLORS[0];
    // Torso
    addSketchRect(-48, 22, 96, 100, 22, shirtColor, cg);
    // Head
    addSketchCircle(0, -40, 52, "#FBE5D6", cg);

    // Hair / Headband
    if (role === "kimi") {
      el("path", { class: "sk-line", d: "M -48 -52 Q 0 -106 48 -52", fill: "none", stroke: GRAPHITE, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": 160, "stroke-dashoffset": 160 }, cg);
      addSketchCircle(-56 * facing, -56, 20, CORAL, cg);
    } else if (role === "budi") {
      el("path", { class: "sk-line", d: "M -44 -58 L -26 -96 L 0 -76 L 26 -96 L 44 -58", fill: "none", stroke: GRAPHITE, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": 180, "stroke-dashoffset": 180 }, cg);
    } else {
      el("path", { class: "sk-line", d: "M -50 -48 Q 0 -100 50 -48", fill: "none", stroke: GRAPHITE, "stroke-width": 7, "stroke-linecap": "round", "stroke-dasharray": 160, "stroke-dashoffset": 160 }, cg);
      el("line", { class: "sk-line", x1: -44, y1: -66, x2: 44, y2: -66, stroke: MUSTARD, "stroke-width": 8, "stroke-linecap": "round", "stroke-dasharray": 100, "stroke-dashoffset": 100 }, cg);
    }

    // Eyes & Mouth
    const eyeR = mood === "kaget" ? 7 : 4.5;
    el("circle", { class: "sk-text", cx: -16 + facing * 4, cy: -44, r: eyeR, fill: GRAPHITE }, cg);
    el("circle", { class: "sk-text", cx: 16 + facing * 4, cy: -44, r: eyeR, fill: GRAPHITE }, cg);

    if (mood === "kaget") {
      el("circle", { class: "sk-text", cx: facing * 4, cy: -16, r: 10, fill: CORAL }, cg);
      addHandText("?!", 62, -78, 44, CORAL, "middle", cg).classList.add("sk-text");
    } else if (mood === "skeptis") {
      el("line", { class: "sk-text", x1: -14, y1: -16, x2: 16, y2: -22, stroke: GRAPHITE, "stroke-width": 4, "stroke-linecap": "round" }, cg);
    } else {
      el("path", { class: "sk-text", d: "M -14 -20 Q 0 -4 14 -20", fill: "none", stroke: GRAPHITE, "stroke-width": 4, "stroke-linecap": "round" }, cg);
    }

    // Name tag
    const label = role === "kimi" ? "Kimi" : role === "budi" ? "Budi" : "Mba Ayu";
    addHandText(label, 0, 158, 34, isActive ? CORAL : GRAPHITE, "middle", cg).classList.add("sk-text");
  }

  function drawKantinScene(g, sc) {
    // Awning & Kantin Counter
    addSketchRect(-330, -230, 660, 72, 16, MUSTARD, g, "KANTIN MBA AYU");
    el("line", { class: "sk-line", x1: -340, y1: 120, x2: 340, y2: 120, stroke: GRAPHITE, "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": 700, "stroke-dashoffset": 700 }, g);
    // Snack jar prop
    addSketchRect(255, 45, 56, 72, 10, SUBJECT_COLORS[1], g);

    const spk = sc.speaker || "kimi";
    const mood = sc.mood || "ceria";
    const ayuFacing = spk === "budi" ? 1 : -1;
    drawCharacter(g, 0, -28, "mba_ayu", spk === "mba_ayu", spk === "mba_ayu" ? mood : (mood === "kaget" ? "kaget" : "ceria"), ayuFacing);
    drawCharacter(g, -210, 12, "kimi", spk === "kimi", spk === "kimi" ? mood : "ceria", 1);
    drawCharacter(g, 210, 12, "budi", spk === "budi", spk === "budi" ? mood : (mood === "kaget" ? "kaget" : "skeptis"), -1);
  }

  function drawOutroKimi(g) {
    drawCharacter(g, 0, -35, "kimi", true, "ceria", 1);
    addHandText("Selanjutnya kita", 0, 195, 46, GRAPHITE, "middle", g).classList.add("sk-text");
    addHandText("bahas apa lagi?", 0, 248, 52, CORAL, "middle", g).classList.add("sk-text");
  }

  const tl = gsap.timeline({ paused: true });
  const dur = Number(data.totalDuration) || 30;

  // Frame 0 Cover Thumbnail -> reveal page
  tl.to("#cover", { opacity: 0, scale: 1.05, duration: 0.45, ease: "power3.inOut" }, 0.35);
  tl.set("#cover", { display: "none" }, 0.8);

  const scenes = data.scenes || [];
  scenes.forEach((sc, idx) => {
    const slot = SLOTS[idx % SLOTS.length];
    const t0 = Number(sc.start) || 0.45;
    const sd = Math.max(1.5, Number(sc.duration) || 4);
    const g = el("g", { id: `sc-${idx}`, transform: `translate(${slot.x}, ${slot.y})` }, world);

    // Light dotted connector path between sketches on the same page
    if (idx > 0) {
      const prev = SLOTS[(idx - 1) % SLOTS.length];
      el("path", {
        d: `M ${prev.x} ${prev.y + 180} Q ${(prev.x + slot.x) / 2} ${(prev.y + slot.y) / 2 - 80} ${slot.x} ${slot.y - 210}`,
        fill: "none", stroke: LIGHT_GRAPH, "stroke-width": 2.5, "stroke-dasharray": "10 10"
      }, construct);
    }

    // Mustard highlight block + handwritten headline above each sketch
    const headTxt = String(sc.headline || data.judul_pendek || "Kimia Sehari").slice(0, 28);
    el("rect", { class: "sk-block", x: -210, y: -338, width: 420, height: 42, rx: 10, fill: MUSTARD, opacity: 0, filter: "url(#chalkEdge)" }, g);
    addHandText(headTxt, 0, -304, 52, GRAPHITE, "middle", g).classList.add("sk-text");
    el("line", { class: "sk-line", x1: -160, y1: -286, x2: 160, y2: -286, stroke: CORAL, "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": 320, "stroke-dashoffset": 320 }, g);

    const vtype = sc.visual_type || "hook";
    if (vtype === "kantin") {
      drawKantinScene(g, sc);
    } else if (vtype === "outro_kimi") {
      drawOutroKimi(g);
    } else if (vtype === "molecule") {
      const atoms = (sc.atoms && sc.atoms.length ? sc.atoms : ["C", "H", "O", "H"]).slice(0, 5);
      const rOrbit = 165;
      const satCoords = atoms.slice(1).map((_, i) => {
        const ang = ((i * 2 * Math.PI) / Math.max(1, atoms.length - 1)) - Math.PI / 2;
        return { x: Math.cos(ang) * rOrbit, y: Math.sin(ang) * rOrbit };
      });
      satCoords.forEach((pt) => {
        el("line", { class: "sk-line", x1: 0, y1: 0, x2: pt.x, y2: pt.y, stroke: GRAPHITE, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": 200, "stroke-dashoffset": 200, filter: "url(#pencilTooth)" }, g);
      });
      addSketchCircle(0, 0, 58, SUBJECT_COLORS[0], g, String(atoms[0]).slice(0, 5));
      satCoords.forEach((pt, i) => {
        addSketchCircle(pt.x, pt.y, 42, SUBJECT_COLORS[(i + 1) % SUBJECT_COLORS.length], g, String(atoms[i + 1]).slice(0, 5));
      });
    } else if (vtype === "reaction") {
      const reactants = (sc.reactants && sc.reactants.length ? sc.reactants : ["Zat A", "Zat B"]).slice(0, 2);
      const catalyst = sc.catalyst || "Reaksi";
      const product = sc.product || "Hasil";
      addSketchRect(-295, -195, 250, 125, 20, SUBJECT_COLORS[1], g, String(reactants[0]).slice(0, 16));
      addSketchRect(45, -195, 250, 125, 20, SUBJECT_COLORS[2], g, String(reactants[1] || "Energi").slice(0, 16));
      addHandText("+", 0, -120, 52, CORAL, "middle", g).classList.add("sk-text");
      el("line", { class: "sk-line", x1: 0, y1: -50, x2: 0, y2: 50, stroke: CORAL, "stroke-width": 6, "stroke-linecap": "round", "stroke-dasharray": 110, "stroke-dashoffset": 110 }, g);
      el("polygon", { class: "sk-text", points: "0,70 -14,44 14,44", fill: CORAL }, g);
      addHandText(String(catalyst).slice(0, 18), 24, 10, 30, CORAL, "start", g).classList.add("sk-text");
      addSketchRect(-220, 90, 440, 130, 24, SUBJECT_COLORS[0], g, String(product).slice(0, 22));
    } else if (vtype === "zoom") {
      addSketchCircle(0, 0, 185, "transparent", g);
      addSketchCircle(0, 0, 105, SUBJECT_COLORS[1], g, String((sc.callouts && sc.callouts[0]) || "ZOOM").slice(0, 12));
    } else if (vtype === "summary") {
      const pts = (sc.callouts && sc.callouts.length ? sc.callouts : ["Proses Alami", "Reaksi Stabil", "Manfaat Nyata"]).slice(0, 3);
      pts.forEach((p, i) => {
        const yy = -190 + i * 145;
        addSketchRect(-310, yy, 620, 110, 20, i === pts.length - 1 ? MUSTARD : SUBJECT_COLORS[0], g, `${i + 1}. ${String(p).slice(0, 24)}`);
      });
    } else {
      addSketchCircle(0, 0, 120, SUBJECT_COLORS[0], g, "?");
      addSketchCircle(175, -105, 44, MUSTARD, g);
      addSketchCircle(-170, 110, 40, CORAL, g);
    }

    // Two-finger tablet camera pan + pinch-zoom + gentle tilt to this sketch
    const camX = 540 - slot.x * slot.zoom;
    const camY = 900 - slot.y * slot.zoom;
    tl.to("#pageCam", {
      x: camX, y: camY, scale: slot.zoom, rotation: slot.rot,
      duration: idx === 0 ? 0.45 : 0.85, ease: "power3.inOut"
    }, t0);

    // Update screen-space badge & callouts
    tl.call(() => {
      badgeEl.textContent = `${idx + 1}/${scenes.length} • ${sc.badge || "Kimia Sehari"}`;
      calloutsEl.innerHTML = "";
      (sc.callouts || []).slice(0, 3).forEach((txt) => {
        const d = document.createElement("div");
        d.className = "note-pill";
        d.textContent = txt;
        calloutsEl.appendChild(d);
      });
      gsap.fromTo("#callouts .note-pill", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.08, ease: "power2.out" });
    }, null, t0);

    // Line first, colour second + stylus riding the sketch
    const lines = g.querySelectorAll(".sk-line");
    const blocks = g.querySelectorAll(".sk-block");
    const texts = g.querySelectorAll(".sk-text");

    tl.to(lines, { strokeDashoffset: 0, duration: Math.min(1.1, sd * 0.3), stagger: 0.08, ease: "power2.out" }, t0 + 0.15);
    tl.fromTo(texts, { opacity: 0, scale: 0.92, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.06, ease: "power2.out" }, t0 + 0.3);
    tl.to(blocks, { opacity: 0.72, duration: Math.min(0.9, sd * 0.25), stagger: 0.08, ease: "power1.out" }, t0 + 0.45);

    // Stylus glides near the active sketch center and lifts off
    tl.fromTo("#stylus", { x: 640, y: 1120, rotation: -28, opacity: 0 }, { x: 540, y: 920, rotation: -34, opacity: 1, duration: 0.45, ease: "power2.out" }, t0 + 0.12);
    tl.to("#stylus", { x: 620, y: 980, rotation: -24, duration: Math.max(0.6, sd * 0.25), ease: "sine.inOut" }, t0 + 0.58);
    tl.to("#stylus", { opacity: 0, y: 1140, duration: 0.3, ease: "power2.in" }, t0 + Math.max(1.2, sd * 0.55));
  });

  tl.to({}, { duration: 0.01 }, dur);

  window.OPENER = { tl, DURATION: dur, ready: true };
  if (!location.search.includes("clean=1")) {
    tl.repeat(-1).play(0);
  }
})();
</script>
</body>
</html>
